[project]
name = "comparyson"
version = "1.0.0"
description = "Compare two directories and inspect file differences side by side."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
